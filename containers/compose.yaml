# Run from the repository root. Create work/in and work/out first; work/out
# must be writable by UID 10001. Put only the intended input files in work/in.
#   docker compose -f containers/compose.yaml run --rm detect detect /work/in/file.pdf --json
#   docker compose -f containers/compose.yaml run --rm clean clean /work/in/file.pdf -o /work/out/file.cleaned.pdf --json
services:
  detect:
    build:
      context: ..
      dockerfile: containers/Dockerfile
    image: doc-sentinel:local
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    environment:
      DOC_SENTINEL_NO_NETNS: "1"
    volumes:
      - ../work/in:/work/in:ro
      - ../work/out:/work/out:rw
  clean:
    build:
      context: ..
      dockerfile: containers/Dockerfile
    image: doc-sentinel:local
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    environment:
      DOC_SENTINEL_NO_NETNS: "1"
    volumes:
      - ../work/in:/work/in:ro
      - ../work/out:/work/out:rw
