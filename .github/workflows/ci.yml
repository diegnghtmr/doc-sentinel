name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - name: Unit tests (integration tests skip without sub-harness deps)
        run: pytest -q -m "not integration"

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: pins.lock.json matches submodule gitlinks
        run: pytest -q tests/test_pins.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa qpdf poppler-utils
      - name: Allow unprivileged user namespaces (detect sandbox uses unshare -rn)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: |
          pip install uv
          uv pip install --system --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e '.[dev,detect,promptguard]' -e 'third_party/perlecta-mcp[rendu]' \
            -e third_party/unicode-smuggling-guard -e third_party/PurpleLlama/LlamaFirewall
          (cd third_party/subtext-scan && npm ci --ignore-scripts)
          CARGO_TARGET_DIR=.cache/cargo cargo build --release --manifest-path third_party/chk_defaced-rs/Cargo.toml
          mkdir -p bin && cp .cache/cargo/release/chk_defaced bin/
      - name: Full corpus (Prompt Guard tests skip without the gated model)
        run: pytest -q

  detect-offline:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker build -f containers/Dockerfile.detect -t doc-sentinel-detect .
      - name: detect runs with --network=none
        # Prompt Guard weights are not in the image, so the verdict cannot be "clean" here;
        # assert the run completed, the Unicode layer ran and the zero-width char was found.
        run: |
          mkdir -p work && printf 'hola\xe2\x80\x8bmundo\n' > work/z.txt
          set +e
          docker run --rm --network=none -e DOC_SENTINEL_NO_NETNS=1 \
            -v "$PWD/work:/work/in:ro" doc-sentinel-detect detect /work/in/z.txt --json > out.json
          code=$?
          set -e
          python3 - "$code" <<'PY'
          import json, sys
          d = json.load(open("out.json"))
          assert d["verdict"] != "clean", d["verdict"]
          assert "unicode-smuggling-guard" in d["adapters_run"], d["adapters_run"]
          assert any(f["class"] == "unicode_smuggling" for f in d["findings"]), d["findings"]
          print("exit", sys.argv[1], "verdict", d["verdict"])
          PY
